name: CI - Calculadora Java Swing

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Verificar versão do Java
        run: |
          java -version
          javac -version

      - name: Verificar targets do Ant
        run: ant -projecthelp

      - name: Limpar e compilar
        run: ant clean jar

      - name: Executar testes unitários
        run: ant test

      - name: Upload da aplicação
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: petshop-java
          path: dist/*.jar
